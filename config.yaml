# 项目基础设置 / Basic project settings
project:
  name: "variable_thickness_chladni_plate" # 项目名称 / Project name
  grid_size: 15 # 厚度矩阵大小 / Thickness matrix size
  plate_length_mm: 150.0 # 板长度 / Plate length
  plate_width_mm: 150.0 # 板宽度 / Plate width
  center_clamp_radius_mm: 8.0 # 中心夹持半径 / Center clamp radius

# 厚度设计变量 / Thickness design variables
thickness:
  design_mode: "continuous" # 厚度优化模式 / Thickness optimisation mode
  min_mm: 0.6 # 连续厚度下限 / Continuous thickness lower bound
  max_mm: 2.0 # 连续厚度上限 / Continuous thickness upper bound
  resolution_mm: 0.001 # 连续厚度输出分辨率 / Continuous thickness output resolution
  levels_mm: [0.6, 0.8, 0.9, 1.0, 1.3, 1.4, 1.8, 2.0] # 可制造厚度等级 / Manufacturable thickness levels
  default_mm: 2.0 # 默认厚度 / Default thickness
  max_neighbor_difference_mm: 1.0 # 相邻单元最大厚度差 / Maximum neighbour thickness difference

# 扩展设计变量 / Expanded design variables
design_variables:
  export_auxiliary_fields: true # 导出辅助物理场 / Export auxiliary physical fields
  density_scale_min: 0.65 # 单元密度倍率下限 / Lower bound for per-cell density scale
  density_scale_max: 1.55 # 单元密度倍率上限 / Upper bound for per-cell density scale
  loss_factor_min: 0.0 # 单元损耗因子下限 / Lower bound for per-cell loss factor
  loss_factor_max: 0.16 # 单元损耗因子上限 / Upper bound for per-cell loss factor
  density_noise_weight: 0.30 # 密度场独立探索权重 / Independent exploration weight for density field
  loss_noise_weight: 0.34 # 损耗场独立探索权重 / Independent exploration weight for loss field

# 材料参数 / Material parameters
material:
  # 默认材料 = Bambu Lab PETG-CF（实测 TDS V3.0，UK 现货）。用弯曲模量(ISO 178)而非拉伸模量，
  # 因为 Chladni 是板弯曲振动。youngs_modulus_pa 取面内弯曲模量 X-Y=2910MPa（作为 E∥/E⊥ 的
  # 几何平均代理）。重要：实测发现「能否出十字」由共振点驱动(phase1_off_resonance_hz=0)决定，
  # 不是 sr —— sr=1.87 与 sr=2.8 都能出干净十字（sr=1.87 的 COMSOL MAX 合成 enr 11.5×/rec0.95
  # 甚至更好），故无需追高 sr。/ Default = Bambu Lab PETG-CF (measured TDS V3.0). Uses FLEXURAL
  # modulus (ISO 178), not tensile, because Chladni is plate bending. The cross's reachability
  # is governed by on-resonance driving (phase1_off_resonance_hz=0), NOT by sr: both sr=1.87
  # and sr=2.8 give clean crosses (sr=1.87 actually scores higher, MAX enr 11.5×/rec0.95).
  density_kg_m3: 1250 # 密度 ISO 1183 / Density (measured)
  poisson_ratio: 0.40 # 泊松比（Bambu 未公布，取 PETG 典型值，待测）/ Poisson (NOT published; PETG-typical, to be measured)
  youngs_modulus_pa: 2910000000 # 面内弯曲模量 X-Y, ISO 178 (2910±260 MPa)；用弯曲而非拉伸(2460) 因为是板弯曲 / In-plane FLEXURAL modulus (bending-relevant)
  thermal_conductivity_w_mk: 0.25 # 导热系数（PETG 典型，Bambu 未公布）/ Thermal conductivity (typical)
  heat_capacity_j_kgk: 1400 # 定压热容（PETG 典型，Bambu 未公布）/ Heat capacity (typical)
  thermal_expansion_1_k: 0.00005 # 热膨胀系数（PETG 典型）/ Thermal expansion (typical)
  # ⚠ 实验侧警告：Bambu PETG-CF 的 Tg=HDT=68°C 偏低；持续激励发热会软化板、模量下降。
  # 实测时控板表面温度<50°C 或间歇冷却。/ LAB WARNING: Tg=HDT=68°C is low; sustained excitation
  # heats & softens the plate. Keep surface temp <50°C or pause to cool during real runs.
  # 正交各向异性参数 / Orthotropic anisotropy
  # 材料档位参考 / Material tier reference:
  #   tier0 (SLA grey resin)   : sr ≈ 1.05, near-isotropic
  #   FDM PLA                  : sr ≈ 1.45 — 学校常备但准各向同性 / common but near-isotropic
  #   Bambu PETG-CF (默认)      : sr ≈ 1.87 — 见下方说明 / see note below
  #   tier2 (Continuous CF)    : sr ≈ 12.0 — surrogate 上限，工程难制造 / surrogate ceiling, hard to manufacture
  # sr=1.87 来自 Bambu 公布的弯曲模量 X-Y/Z = 2910/1560。注意这是【层间】各向异性(Z=穿层)，
  # 而 Chladni 板需要的是【面内】0°/90° infill 各向异性——Bambu 未公布，估计 1.5–2.0。1.87 作为
  # 合理代理上界。建议打 0°/45°/90° 弯曲试样(ISO 178)实测面内 E∥/E⊥ 再回填。/ sr=1.87 = Bambu's
  # flexural X-Y/Z. NOTE this is LAYER anisotropy (Z=through-thickness); Chladni needs IN-PLANE
  # 0°/90° anisotropy which Bambu does NOT publish (est. 1.5–2.0). 1.87 is a proxy upper bound;
  # measure 0°/45°/90° flexural beams (ISO 178) and update. The cross does NOT need a high sr.
  stiffness_ratio: 1.87 # E_||/E_⊥；面内值待实测 / E_||/E_perp; in-plane value to be measured
  shear_ratio: 1.0 # G_pp / G_iso（Bambu 未公布 G12，取各向同性 1.0，待测）/ G12 NOT published; isotropic assumption, to be measured

# 生产 pipeline 配置 / Production pipeline configuration
# 经过 350+ 次实验后验证的最佳路径：W10 surrogate → COMSOL eigfreq → Phase 1 IC-likeness → Phase 2 trust-region
# Validated path after 350+ experiments: W10 surrogate → COMSOL eigfreq → Phase 1 → Phase 2.
production:
  default_candidate_id: "production_design" # 默认候选编号 / Default candidate id
  # 各向异性 sr/shear 统一由上面的 material: 段定义（此处不再重复，避免覆盖所选材料）。
  # 仍可用 production.stiffness_ratio 或 CLI --stiffness-ratio 临时覆盖。/ Anisotropy is
  # defined once in material: above; not duplicated here so it can't silently override the
  # chosen material. A production.stiffness_ratio key or CLI flag can still override.
  w10_num_steps: 300 # surrogate Adam 步数 / Surrogate Adam steps
  w10_lr_h: 0.05 # H 学习率 / H learning rate
  w10_num_frequencies: 6 # 联合频率数 K / Joint frequency count K (theta optimisation removed 2026-05; see BATTERY_FINDINGS.md)
  w10_f_min_hz: 120.0 # / Frequency lower bound
  w10_f_max_hz: 1200.0 # / Frequency upper bound
  w10_sigma_anneal_start: 0.20 # Sigma 退火起点（防止细线 target 梯度悬崖）/ Sigma annealing start; protects against thin-target gradient cliff
  w10_sigma_anneal_steps: 100 # Sigma 退火步数 / Anneal step count
  w10_target_dilation_px: 2 # 目标膨胀像素数（proxy 网格）/ Target dilation px on proxy grid
  w10_min_surrogate_enrichment: 0.5 # 健康度阈值；surrogate enrichment 低于此值直接拒绝喂 COMSOL / Health-check threshold
  multistart_n: 1 # 多启动种子数；1=关闭（无开销），4~8=逃避局部极小；保底永远包含 seed=42 / Multi-start seed count
  multistart_uplift_threshold: 0.05 # 赢家相对 seed=42 最少 +5% 复合 score 才会被采纳（防退化）/ Anti-regression uplift threshold
  phase2_score_mode: composite # composite (enr·√rec, 防塌陷) | enrich_only (legacy) / Phase 2 acceptance score mode
  phase1_top_k_modes: 6 # IC-likeness 选 top-K 模态 / Top-K IC-likeness modes
  phase1_off_resonance_hz: 0.0 # 本征模态共振点驱动(0=on-resonance)；2%阻尼下响应有限且模态最纯，偏1.5Hz会把图案搞糊掉recall(已验证 sr3 十字模态 on-res enr2.68/rec0.54 vs +1.5 enr2.21/rec0.42) / Drive eigenmodes on-resonance; detune smears the figure
  magic_off_resonance_hz: [165.0] # CF-PETG tier1(sr≈3) 经验 magic 频率；battery 实测它能把十字打出来。换材料/目标请用前端"Pre-sweep magic freqs"重扫或关 enable_magic_freqs / tier1 CF-PETG magic freq (battery confirmed it yields the cross); re-sweep for other materials/targets or disable
  enable_magic_freqs: false # 默认材料已是 Bambu PETG-CF(sr=1.87)，165 是 sr=3 校准的不适用；且 E3 共振点驱动下十字来自本征模态、无需 magic。换回 tier1 或为新材料重扫后再开 / Default material is now Bambu PETG-CF; magic 165 was sr=3-calibrated and the on-resonance eigenmodes already yield the cross, so magic is off. Re-enable after re-sweeping for the active material
  phase1_w10_topn: 3 # Phase 1 drive 列表里追加 W10 训练频率的 top-N（按 W10 权重排序）；0 关闭 / Include top-N W10-trained freqs in P1 drive list (sorted by W10 weight)
  eig_n_modes: 30 # COMSOL eigenfreq 求解阶数 / COMSOL eigenfrequency modes
  phase1_band_slack_hz: 20.0 # Phase 1 选频允许超出 W10 设计带宽的 slack；防止低频"中心一坨"基频混进 drive 列表 / Slack for Phase 1 in-band gate (rejects out-of-band fundamentals like 72 Hz central blobs)
  phase1_offband_min_enrichment: 2.0 # 带外本征模态的质量旁路：enrichment≥此值才放行（放行十字/叉的优质低频模态 enr≈6，仍挡掉中心一坨 enr≈1）；调到很大=恢复旧硬下限 / Quality escape hatch: admit out-of-band eigenmodes only if enrichment ≥ this (lets in good low-order cross/X modes, still blocks central-blob fundamentals); set huge to restore hard floor
  phase2_max_iters: 3 # 信任域外层迭代数（0 = 跳过 Phase 2；旧默认 1 实质 delta=0） / Trust-region outer iters (was 1, raised so P2 can actually escape the P1 basin)
  phase2_inner_steps: 200 # 每次 Phase 2 内层 W10 步数（旧默认 80 太短） / Inner W10 steps per Phase 2 iter (was 80)
  phase2_lr_h_init: 0.025 # / Trust-region H LR initial
  phase2_freeze_freq_first_steps: 20 # P2 内层冻结 freq/weight 步数（W10 默认 60，对 P2 短步数太长） / Freeze freq/weight first-N steps in P2 (W10 default 60 is too long for short P2 inner runs)

# COMSOL 仿真设置 / COMSOL simulation settings
simulation:
  num_modes: 80 # 导出模态数量 / Number of exported modes
  frequency_min_hz: 0 # 最小目标频率 / Minimum target frequency
  frequency_max_hz: 3000 # 最大目标频率 / Maximum target frequency

# COMSOL 模型合同 / COMSOL model contract
comsol:
  model_path: "comsol_templates/Chladni_15x15_design_bound.mph" # 绑定模型路径 / Bound model path
  source_model_path: "/Users/apple/Documents/Chladni.mph" # 原始基准模型路径 / Original baseline model path
  comsol_command_path: "/Applications/COMSOL64/Multiphysics/bin/comsol" # COMSOL 命令路径 / COMSOL command path
  server_host: "127.0.0.1" # COMSOL server 主机 / COMSOL server host
  server_port: 2036 # COMSOL server 端口 / COMSOL server port
  auto_start_server: true # 自动启动 COMSOL server / Automatically start COMSOL server
  server_start_timeout_s: 30 # COMSOL server 启动等待秒数 / COMSOL server startup wait seconds
  retry_max_attempts: 2 # MATLAB 失败时最多重试次数（含首次）。失败若是 mphserver/license/连接异常，会先 kill stale mphserver 再重启后重试。/ Max MATLAB attempts (including the first). On transient mphserver/license/connection failures the wrapper kills any stale mphserver, restarts, then retries.
  matlab_path: "/Applications/MATLAB_R2024a.app/bin/matlab" # MATLAB 路径 / MATLAB path
  livelink_timeout_s: 7200 # 单次 LiveLink 运行超时秒数 / Single LiveLink run timeout seconds
  runner_path: "comsol_templates/run_chladni_candidate.m" # LiveLink 运行脚本 / LiveLink runner script
  forced_response_runner_path: "comsol_templates/run_chladni_forced_response.m" # 强迫响应 LiveLink 脚本 / Forced-response LiveLink runner script
  design_contract_runner_path: "comsol_templates/apply_design_variable_contract.m" # 设计变量合同升级脚本 / Design-variable contract upgrade script
  study_tag: "std1" # 特征频率研究标签 / Eigenfrequency study tag
  shell_tag: "shell" # 壳物理场标签 / Shell physics tag
  displacement_expression: "shell.w" # 面外位移表达式 / Out-of-plane displacement expression

# 目标图与节点线提取设置 / Target and nodal extraction settings
nodal_extraction:
  image_size: 256 # 算法统一图像尺寸 / Unified algorithm image size
  epsilon_ratio: 0.025 # 节点线阈值比例 / Nodal threshold ratio
  target_mode: "chladni" # 目标提取模式 / Target extraction mode
  target_line_width_px: 8 # 目标线宽 / Target line width
  remove_center_region: true # 是否移除中心夹持区域 / Whether to remove center clamp

# 优化设置 / Optimisation settings
optimisation:
  method: "hybrid_ga_bayesian_kl_search" # 搜索方法 / Search method
  population_size: 24 # 每批候选数量 / Candidates per batch
  num_iterations: 8 # 默认优化代数 / Default optimisation generations
  genetic_parent_count: 12 # 遗传算法父代数量 / Genetic algorithm parent count
  genetic_mutation_rate: 0.18 # 遗传算法变异率 / Genetic algorithm mutation rate
  bayesian_virtual_pool_size: 360 # 贝叶斯虚拟候选池大小 / Bayesian virtual candidate-pool size
  bayesian_ensemble_size: 16 # 贝叶斯代理集成数量 / Bayesian surrogate ensemble size
  bayesian_ucb_beta: 0.42 # 贝叶斯 UCB 探索强度 / Bayesian UCB exploration strength
  bayesian_expected_improvement_weight: 0.30 # 期望改进权重 / Expected improvement weight
  target_min_mode: 8 # 目标图案最低匹配模态 / Minimum mode used for target matching
  modal_compiler_count: 4 # 目标模态编译候选数量 / Number of target-modal compiler candidates
  auxiliary_physics_count: 16 # 独立质量阻尼候选数量 / Number of independent mass-damping candidates
  auxiliary_physics_frontload_count: 10 # 每代前置质量阻尼候选数量 / Number of mass-damping candidates front-loaded per generation
  latent_physics_count: 10 # 低维潜变量物理候选数量 / Number of low-dimensional latent physics candidates
  latent_physics_frontload_count: 6 # 每代前置潜变量物理候选数量 / Number of latent physics candidates front-loaded per generation
  latent_physics_pool_size: 180 # 潜变量物理虚拟候选池大小 / Latent physics virtual candidate-pool size
  latent_physics_cma_base_count: 6 # 潜变量进化优化锚点数量 / Number of anchors for latent evolutionary optimisation
  latent_physics_cma_steps: 5 # 潜变量进化优化轮数 / Number of latent evolutionary optimisation steps
  latent_physics_cma_population: 22 # 每轮潜变量样本数量 / Latent samples per evolutionary step
  latent_physics_cma_elite_fraction: 0.28 # 潜变量精英样本比例 / Elite fraction for latent optimisation
  latent_physics_cma_sigma: 0.82 # 潜变量初始探索尺度 / Initial latent exploration sigma
  latent_response_correction_weight: 0.075 # 真实响应误差校正权重 / Real-response error correction weight
  latent_surrogate_optimism_penalty: 0.45 # 潜变量代理过度乐观惩罚 / Penalty for over-optimistic latent surrogate predictions
  adaptive_family_scheduling: true # 根据真实分数自适应分配算法家族名额 / Adaptively allocate candidate-family slots from real scores
  adaptive_family_history_limit: 96 # 自适应调度使用的最近真实候选数量 / Recent real candidates used by adaptive scheduling
  adaptive_family_margin: 0.0012 # 家族切换所需真实分数优势 / Real-score advantage needed for family reallocation
  adaptive_min_latent_frontload: 2 # 潜变量家族最少前置名额 / Minimum front-loaded slots for latent family
  response_guidance_limit: 10 # 真实响应失败记忆数量 / Number of real-response failure memories
  response_guidance_pool_limit: 36 # 真实响应闭环候选池数量 / Real-response closed-loop pool size
  response_closed_loop_count: 10 # 每批优先进入队列的真实响应闭环候选数 / Real-response closed-loop candidates promoted into each batch
  feasibility_min_real_candidates: 4 # 可行性诊断最少真实候选数 / Minimum real candidates for feasibility diagnosis
  feasibility_score_floor: 0.08 # 厚度单变量可接受分数下限 / Acceptable score floor for thickness-only search
  feasibility_precision_floor: 0.20 # 厚度单变量可接受精度下限 / Acceptable precision floor for thickness-only search
  kl_proxy_weight: 0.06 # KL 物理代理权重 / KL physics proxy weight
  kl_proxy_surrogate_cap: 0.10 # 代理采集中的 KL 可信增益上限 / Trusted KL gain cap inside surrogate acquisition
  kl_proxy_real_history_radius: 0.10 # KL 代理真实历史相似度半径 / Real-history similarity radius for KL proxy
  kl_proxy_real_penalty_weight: 0.18 # KL 代理靠近坏真实样本的惩罚权重 / Penalty weight when KL proxy is near bad real samples
  kl_proxy_real_reward_weight: 0.045 # KL 代理靠近好真实样本的奖励权重 / Reward weight when KL proxy is near good real samples
  kl_proxy_objective: "search_soft" # KL 代理搜索目标 / KL proxy search objective
  kl_proxy_grid_size: 31 # KL 代理高分辨率求解网格 / High-resolution solve grid for KL proxy
  kl_proxy_num_modes: 32 # KL 代理参与匹配的模态数量 / Number of KL proxy modes used for matching
  kl_proxy_min_mode: 8 # KL 代理最低匹配模态 / Minimum KL proxy matching mode
  kl_proxy_optimised_count: 3 # KL 直接优化候选数量 / Number of directly KL-optimised candidates
  kl_proxy_local_steps: 14 # KL 直接优化局部搜索步数 / Local search steps for direct KL optimisation
  kl_proxy_pool_stride: 6 # 贝叶斯候选池 KL 精算间隔 / KL exact-scoring interval for Bayesian pool
  kl_proxy_start_temperature: 0.080 # KL 退火初始温度 / Initial KL annealing temperature
  kl_proxy_end_temperature: 0.006 # KL 退火结束温度 / Final KL annealing temperature
  novelty_weight: 0.30 # 新颖度探索权重 / Novelty exploration weight
  roughness_weight: 0.15 # 归一化粗糙度惩罚权重 / Normalized roughness penalty weight
  mass_weight: 0.01 # 质量惩罚权重 / Mass penalty weight
  frequency_weight: 0.01 # 频率惩罚权重 / Frequency penalty weight

# 路径设置 / Path settings
paths:
  target_pattern: "data/target_patterns/target.png" # 目标图路径 / Target image path
  processed_targets_dir: "data/processed_targets" # 处理后目标图目录 / Processed target directory
  candidates_dir: "candidates" # 候选结构目录 / Candidate directory
  comsol_exports_dir: "data/comsol_exports" # COMSOL 导出目录 / COMSOL export directory

# 产物保留策略 / Artifact retention policy
artifact_retention:
  keep_latest_generations: 3 # 始终保留最近代数 / Always keep newest generations
  keep_recent_days: 14 # 始终保留最近天数 / Always keep recent days
  regenerable_only: true # 仅清理可再生成产物 / Only clean regenerable artifacts
